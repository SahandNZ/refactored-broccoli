kronos-base = "2b554741eca47781b64468546e77fef3e85130e6"

# Release date (UTC) of each model = the later of repository creation and first weight upload
# (owner decision A2), from the Hugging Face history checked on 2026-11-17; scoring starts at
# max(release date, upload date of the pinned weights, options.weight_dates)
[options.release_dates]
chronos-bolt-small = "2024-11-25"
chronos-bolt-base = "2024-11-25"
chronos-2 = "2025-10-30"
"timesfm-2.5" = "2025-09-02"
timesfm-3 = "2026-08-24"
"tirex-1.1" = "2025-05-26"
tirex-2 = "2026-06-16"
toto-2-22m = "2026-04-14"
toto-2-313m = "2026-04-14"
t0-gamma = "2026-10-15"
moirai-2-small = "2025-08-06"
kronos-small = "2025-06-30"
kronos-base = "2025-06-30"

# Upload date (UTC) of the exact weights of the pinned revision: the earliest commit whose
# weight tensors equal them (a later format conversion with identical tensors keeps the
# earlier date). A model is scored only after the later of this and its release date.
[options.weight_dates]
chronos-bolt-small = "2024-11-25"
chronos-bolt-base = "2024-11-25"
chronos-2 = "2025-10-30"
"timesfm-2.5" = "2025-09-02"
timesfm-3 = "2026-08-24"
"tirex-1.1" = "2025-05-26"
tirex-2 = "2026-07-02"
toto-2-22m = "2026-04-14"
toto-2-313m = "2026-05-12"
t0-gamma = "2026-10-15"
moirai-2-small = "2025-08-06"
kronos-small = "2025-06-30"
kronos-base = "2025-06-30"

[options.pretraining_cutoffs]
kronos-small = "2024-07-01"
kronos-base = "2024-07-01"
