# Candidate instruments for experiments/01-universe and the download period.
# name = source code. Read by src.data.load_data_config. Every key is required except three
# optional keys of a group: `timeframe` (without it the base bars are 15m), `no_reference`
# (without it every stock of the group has a Yahoo reference) and `calendars` (without it an
# instrument's coverage is counted on weekdays, or every day for crypto).
# Crypto: Binance USD-M perpetuals listed by 2020-09-30 and still trading on 2026-10-31
# (each starts at its own listing date), filled to 64 with the next earliest-listed active
# perpetuals (Oct-Nov 2020). The lists were set when the quotas were crypto 16, forex 16,
# commodities 8, indices 8 and stocks 16: four times each quota where the source has enough,
# eight times for stocks; commodities and indices take everything Dukascopy has (some start
# after 2020; the 01-universe data filter decides). With today's quotas (01-universe
# study.toml) crypto has 8 times its quota of 8, forex 4 times 16, the US stocks 3 times 16
# and the non-US stocks 5 times 16.
# Stocks: 128 candidates, 48 US (all from Alpaca: SIP feed, split adjusted, no bid/ask, so no
# spread) and 80 from Europe, Japan and Hong Kong (Dukascopy). Stock names are Yahoo tickers
# (e.g. SAP.DE, 7203.T), so each can be checked against Yahoo daily data.

[period]
start = "2020-01-01"
end = "2026-11-01"

# Dukascopy queue order (2026-11-16, rate-limited): commodities and indices first, then the
# last FX pairs, then non-US stocks one region at a time, largest first.
# Downloads are I/O bound: threads per source. Dukascopy answers HTTP 429 (rate limit) above
# about 16 parallel downloads (each one runs 10 requests at once), so it stays at 16. Builds
# (split adjustment, quality checks, timeframes) use processes.
[download.workers]
binance = 64
dukascopy = 4
alpaca = 2
yahoo = 4
build = 16

[quality]
min_coverage = 0.95
max_gap_days = 10
max_negative_spread_share = 0.001
outlier_sigma = 10
max_abs_return = 0.4
# Yahoo check of stocks (src.data.check_quality): absolute difference between our and Yahoo's
# daily close-to-close log returns on common days, in bps (returns, not price levels, so a level
# offset does not count; the 99th percentile leaves out the few days of a corporate action). On
# 2020-2023 (2026-11-16): US stocks (Alpaca) median 1.5-4, 99th percentile 11-41; non-US stocks
# (Dukascopy, whose last quote differs from the closing auction) median 8-27, 99th percentile
# 40-170; on 2020-2026 the largest are a median of 30 (NESTE.HE) and a 99th percentile of 183
# (8035.T). The limits lie well above every real stock and catch closes that are wrong on many
# days (a 1 % daily error gives a median of about 100).
yahoo_return_median_bps = 50
yahoo_return_p99_bps = 250
# Largest share of bars with high equal to low. Frozen filler bars (a constant price, as Binance
# wrote after a delisting) push it far up. On 2020-2023 the real data of every candidate stays at
# or below 0.150 (VIX; median 0.0001, 99th percentile 0.047), the frozen CVCUSDT series has 0.347
# (2026-11-16); 0.25 lies between them.
max_flat_share = 0.25

# Exchange calendar of a stock (exchange_calendars), from the suffix of its Yahoo ticker; "" is a
# ticker without a suffix (New York). Coverage and the Yahoo comparison use these sessions.
[stock_calendars]
"" = "XNYS"
DE = "XETR"
PA = "XPAR"
L = "XLON"
SW = "XSWX"
AS = "XAMS"
MC = "XMAD"
MI = "XMIL"
ST = "XSTO"
CO = "XCSE"
OL = "XOSL"
HE = "XHEL"
BR = "XBRU"
T = "XTKS"
HK = "XHKG"

