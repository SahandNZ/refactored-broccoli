instruments = { ETHUSDT = "ETHUSDT", BCHUSDT = "BCHUSDT", BTCUSDT = "BTCUSDT", XRPUSDT = "XRPUSDT", LTCUSDT = "LTCUSDT", TRXUSDT = "TRXUSDT", ETCUSDT = "ETCUSDT", LINKUSDT = "LINKUSDT", XLMUSDT = "XLMUSDT", ADAUSDT = "ADAUSDT", XMRUSDT = "XMRUSDT", DASHUSDT = "DASHUSDT", ZECUSDT = "ZECUSDT", XTZUSDT = "XTZUSDT", ATOMUSDT = "ATOMUSDT", BNBUSDT = "BNBUSDT", ONTUSDT = "ONTUSDT", IOTAUSDT = "IOTAUSDT", BATUSDT = "BATUSDT", VETUSDT = "VETUSDT", NEOUSDT = "NEOUSDT", QTUMUSDT = "QTUMUSDT", IOSTUSDT = "IOSTUSDT", THETAUSDT = "THETAUSDT", ALGOUSDT = "ALGOUSDT", ZILUSDT = "ZILUSDT", KNCUSDT = "KNCUSDT", ZRXUSDT = "ZRXUSDT", COMPUSDT = "COMPUSDT", OMGUSDT = "OMGUSDT", DOGEUSDT = "DOGEUSDT", KAVAUSDT = "KAVAUSDT", BANDUSDT = "BANDUSDT", RLCUSDT = "RLCUSDT", WAVESUSDT = "WAVESUSDT", MKRUSDT = "MKRUSDT", SNXUSDT = "SNXUSDT", DOTUSDT = "DOTUSDT", YFIUSDT = "YFIUSDT", CRVUSDT = "CRVUSDT", BALUSDT = "BALUSDT", TRBUSDT = "TRBUSDT", SUSHIUSDT = "SUSHIUSDT", RUNEUSDT = "RUNEUSDT", EGLDUSDT = "EGLDUSDT", SOLUSDT = "SOLUSDT", ICXUSDT = "ICXUSDT", STORJUSDT = "STORJUSDT", BLZUSDT = "BLZUSDT", UNIUSDT = "UNIUSDT", AVAXUSDT = "AVAXUSDT", FTMUSDT = "FTMUSDT", ENJUSDT = "ENJUSDT", FLMUSDT = "FLMUSDT", RENUSDT = "RENUSDT", KSMUSDT = "KSMUSDT", NEARUSDT = "NEARUSDT", FILUSDT = "FILUSDT", AAVEUSDT = "AAVEUSDT", RSRUSDT = "RSRUSDT", LRCUSDT = "LRCUSDT", OCEANUSDT = "OCEANUSDT", CVCUSDT = "CVCUSDT", BELUSDT = "BELUSDT" }

[groups.commodity]
market = "commodity"
source = "dukascopy"
# The softs are counted on their exchange's sessions (owner's rule of 2026-11-16 for indices,
# extended to the softs): on 2020-2023 COCOA, COFFEE, COTTON, OJUICE and SOYBEAN miss 36 of the
# 37 New York exchange holidays on weekdays and almost no other day (ICE US softs, CBOT
# soybeans); SUGAR misses 33 of the 35 London holidays and only 13 of the New York ones, so its
# Dukascopy series follows London, not ICE US. Metals and energy miss only about 7 weekdays in
# four years (Christmas, New Year), no exchange's holidays, and stay on weekdays. With these
# calendars the softs cover 0.998-1.000 of their sessions (0.964-0.967 of the weekdays).
calendars = { COCOA = "XNYS", COFFEE = "XNYS", COTTON = "XNYS", OJUICE = "XNYS", SOYBEAN = "XNYS", SUGAR = "XLON" }
instruments = { XAUUSD = "xauusd", XAGUSD = "xagusd", COPPER = "coppercmdusd", BRENT = "brentcmdusd", WTI = "lightcmdusd", NATGAS = "gascmdusd", GASOIL = "dieselcmdusd", SOYBEAN = "soybeancmdusx", COFFEE = "coffeecmdusx", SUGAR = "sugarcmdusd", COCOA = "cocoacmdusd", COTTON = "cottoncmdusx", OJUICE = "ojuicecmdusx", XPTUSD = "xptcmdusd", XPDUSD = "xpdcmdusd" }

[groups.index]
